[package]
name = "renart"
version = "0.1.0"
description = "RenArt — Captura de precisão e anotação fluida"
authors = ["Antigravity & Usuario"]
edition = "2021"

[lib]
name = "renart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcap = "0.2"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
interprocess = "2.2"

# xcap 0.2.2 não compila no macOS com core-foundation 0.10.1 (E0282 em ToVoid::to_void).
# Mantém a 0.10.0 até migrar o xcap para uma versão nova.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.0"
core-graphics = "0.24"
objc2-app-kit = { version = "0.3", features = ["NSCursor"] }

[dev-dependencies]

# Dependências otimizadas mesmo em dev: a codificação PNG (image/png/flate2) fica ~10-30x mais rápida.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
